name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack the signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::SIGNING_KEYSTORE_B64 secret not set; the APK will be signed with a throwaway debug key, so later builds won't install over it."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Run unit tests and build the release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleRelease

      - name: Name the APK and record its checksum
        run: |
          APK="MultiAiLauncher-1.0.${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" | tee "$APK.sha256"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: MultiAiLauncher-apk
          path: |
            MultiAiLauncher-*.apk
            MultiAiLauncher-*.apk.sha256

      - name: Publish to the "latest" release (download page for your phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$APK" "$APK.sha256" \
            --title "Multi-AI Launcher 1.0.${GITHUB_RUN_NUMBER}" \
            --notes "Built from ${GITHUB_SHA} (branch ${GITHUB_REF_NAME}). Download the .apk on your phone and open it to install." \
            --target "${GITHUB_SHA}"

      - name: Upload test reports if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/
